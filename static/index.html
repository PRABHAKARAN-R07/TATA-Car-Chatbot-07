<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tata Car Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <div class="bar">
    <span class="signal" id="signal" aria-hidden="true"></span>
    <h1>Tata Car Guide</h1>
    <span class="sub">Answers from the Tata brochures</span>
    <button id="clear" type="button">New chat</button>
  </div>
  <nav class="lineup" id="lineup" aria-label="Tata SUV models"></nav>
</header>

<main id="scroller">
  <div class="thread" id="thread" aria-live="polite"></div>
</main>

<footer>
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Ask about a Tata car, variant or feature" aria-label="Your question"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter to send, Shift+Enter for a new line</div>
</footer>

<script src="./script.js" defer></script>
</body>
</html>
